name: Deploy Edge Functions
# Manual only: deploys Aprico's own Edge Functions from main, the same command as on the PC.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token).
on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        options:
          - line-oa-kit-studio
          - line-oa-kit-runtime-ai
          - line-assistant
          - line-oa-kit-intro
          - line-oa-kit-github
          - line-oa-kit-menu-setup
          - all
permissions:
  contents: read
concurrency:
  group: deploy-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Same gate as the Pages build: nothing is deployed if the tests fail.
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FN: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ "$FN" = all ]; then
            set -- line-oa-kit-studio line-oa-kit-runtime-ai line-assistant line-oa-kit-intro line-oa-kit-github line-oa-kit-menu-setup
          else
            set -- "$FN"
          fi
          for f in "$@"; do
            supabase functions deploy "$f" --project-ref hhcubvixldieuwdeqnwc --no-verify-jwt --use-api --yes
          done
